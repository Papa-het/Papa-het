<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Yerkin Myrzabekov — Software Engineer</title>
  <desc id="desc">A dark, animated developer terminal banner for Yerkin Myrzabekov's GitHub profile.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.52" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#11102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#94a3b8" stroke-opacity="0.075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="canvasClip">
      <rect width="1200" height="420" rx="28"/>
    </clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; }
      .float-one { animation: floatOne 7s ease-in-out infinite; transform-origin: center; }
      .float-two { animation: floatTwo 9s ease-in-out infinite; transform-origin: center; }
      .blink { animation: blink 1.1s steps(2, end) infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      @keyframes floatOne { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
      @keyframes floatTwo { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-9px, 8px); } }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: 0; } }
      @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.18); } }
      @media (prefers-reduced-motion: reduce) {
        .float-one, .float-two, .blink, .pulse { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#canvasClip)">
    <rect width="1200" height="420" fill="url(#background)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <circle cx="155" cy="92" r="250" fill="url(#cyanGlow)"/>
    <circle cx="1080" cy="360" r="300" fill="url(#violetGlow)"/>

    <g opacity="0.8">
      <circle class="float-one" cx="1118" cy="66" r="5" fill="#5eead4" filter="url(#softGlow)"/>
      <circle class="float-two" cx="674" cy="91" r="4" fill="#c084fc" filter="url(#softGlow)"/>
      <circle class="pulse" cx="650" cy="337" r="3.5" fill="#60a5fa" filter="url(#softGlow)"/>
      <path d="M665 92 L1088 65" stroke="#5eead4" stroke-opacity="0.12"/>
      <path d="M650 337 L1054 349" stroke="#a78bfa" stroke-opacity="0.1"/>
    </g>

    <g transform="translate(70 67)">
      <rect x="0" y="0" width="178" height="30" rx="15" fill="#5eead4" fill-opacity="0.1" stroke="#5eead4" stroke-opacity="0.38"/>
      <circle cx="18" cy="15" r="4" fill="#5eead4"/>
      <text x="31" y="20" class="mono" fill="#99f6e4" font-size="12" letter-spacing="1.2">PAPA-HET / DEV</text>

      <text x="0" y="91" class="sans" fill="#94a3b8" font-size="22" font-weight="600">Hello, I'm</text>
      <text x="-3" y="163" class="sans" fill="url(#accent)" font-size="70" font-weight="800" letter-spacing="-2.5">Yerkin</text>
      <text x="-3" y="225" class="sans" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="-2.5">Myrzabekov</text>
      <text x="0" y="270" class="sans" fill="#cbd5e1" font-size="19">Software engineer · systems thinker · lifelong builder</text>
      <g transform="translate(0 282)">
        <path d="M9 0C4.6 0 1 3.6 1 8c0 6 8 14 8 14s8-8 8-14c0-4.4-3.6-8-8-8Zm0 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6Z" fill="#94a3b8"/>
        <text x="27" y="16" class="mono" fill="#94a3b8" font-size="14">Milan, Italy</text>
      </g>
    </g>

    <g transform="translate(728 65)">
      <rect width="405" height="290" rx="22" fill="#050914" fill-opacity="0.9" stroke="#64748b" stroke-opacity="0.28"/>
      <path d="M0 49 H405" stroke="#64748b" stroke-opacity="0.22"/>
      <circle cx="24" cy="24" r="5.5" fill="#fb7185"/>
      <circle cx="43" cy="24" r="5.5" fill="#fbbf24"/>
      <circle cx="62" cy="24" r="5.5" fill="#34d399"/>
      <text x="203" y="29" text-anchor="middle" class="mono" fill="#64748b" font-size="11">~/workspace/profile.ts</text>

      <text x="24" y="83" class="mono" fill="#64748b" font-size="14">01</text>
      <text x="58" y="83" class="mono" fill="#c084fc" font-size="14">const</text>
      <text x="106" y="83" class="mono" fill="#e2e8f0" font-size="14">developer</text>
      <text x="188" y="83" class="mono" fill="#5eead4" font-size="14">=</text>
      <text x="204" y="83" class="mono" fill="#f8fafc" font-size="14">{</text>

      <text x="24" y="112" class="mono" fill="#64748b" font-size="14">02</text>
      <text x="78" y="112" class="mono" fill="#93c5fd" font-size="14">craft</text>
      <text x="126" y="112" class="mono" fill="#f8fafc" font-size="14">:</text>
      <text x="142" y="112" class="mono" fill="#86efac" font-size="14">"useful products"</text>
      <text x="294" y="112" class="mono" fill="#f8fafc" font-size="14">,</text>

      <text x="24" y="141" class="mono" fill="#64748b" font-size="14">03</text>
      <text x="78" y="141" class="mono" fill="#93c5fd" font-size="14">stack</text>
      <text x="126" y="141" class="mono" fill="#f8fafc" font-size="14">:</text>
      <text x="142" y="141" class="mono" fill="#86efac" font-size="14">["TypeScript", "Go"]</text>
      <text x="319" y="141" class="mono" fill="#f8fafc" font-size="14">,</text>

      <text x="24" y="170" class="mono" fill="#64748b" font-size="14">04</text>
      <text x="78" y="170" class="mono" fill="#93c5fd" font-size="14">mode</text>
      <text x="118" y="170" class="mono" fill="#f8fafc" font-size="14">:</text>
      <text x="134" y="170" class="mono" fill="#86efac" font-size="14">"always learning"</text>
      <text x="278" y="170" class="mono" fill="#f8fafc" font-size="14">,</text>

      <text x="24" y="199" class="mono" fill="#64748b" font-size="14">05</text>
      <text x="58" y="199" class="mono" fill="#f8fafc" font-size="14">};</text>

      <path d="M24 222 H381" stroke="#64748b" stroke-opacity="0.18"/>
      <text x="24" y="254" class="mono" fill="#5eead4" font-size="13">➜</text>
      <text x="46" y="254" class="mono" fill="#cbd5e1" font-size="13">status</text>
      <text x="101" y="254" class="mono" fill="#64748b" font-size="13">:</text>
      <text x="116" y="254" class="mono" fill="#a7f3d0" font-size="13">ready_to_build</text>
      <rect class="blink" x="246" y="242" width="8" height="15" rx="1" fill="#5eead4"/>
    </g>

    <rect x="70" y="386" width="1060" height="1" fill="url(#accent)" opacity="0.65"/>
    <text x="70" y="407" class="mono" fill="#64748b" font-size="11" letter-spacing="1.4">GITHUB.COM/PAPA-HET</text>
    <text x="1130" y="407" text-anchor="end" class="mono" fill="#64748b" font-size="11" letter-spacing="1.2">BUILD · LEARN · SHARE</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="418.5" rx="27.25" fill="none" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1.5"/>
</svg>
